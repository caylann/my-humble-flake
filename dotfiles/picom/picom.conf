animations = true;
frame-opacity = 1.0;

opacity-rule = [
  "88:class_g = 'Alacritty'",
  "88:class_g = 'Rofi'",
  "100:class_g = 'dwm'",
  "100:window_type = 'dock'"
];

fading = true;
fade-in-step = 0.15;
fade-out-step = 0.15;
backend = "glx";
xrender-sync-fence = true;
unredir-if-possible = false;
use-damage = false;
blur-background = false;
vsync = true;
corner-radius = 0;

