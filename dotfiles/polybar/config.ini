[colors]
background = #0F1011
background-alt = #373B41
foreground = #F5F5F5
primary = #778899
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
override-redirect = false
wm-restack = generic
bottom = true

width = 100%
height = 24pt
radius = 0

dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-left-size = 250pt
border-bottom-size = 4pt
border-top-size = 0pt
border-right-size = 250pt

border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "Terminess Nerd Font Propo:style=Bold:size=16;3"

modules-left = nixos dwm xwindow
modules-right = systray bypass pulseaudio xkeyboard memory cpu date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/bypass]
type = custom/script
exec = ~/nixos/dotfiles/polybar/scripts/bypass.sh
interval = 3
click-left = ~/nixos/dotfiles/polybar/scripts/bypass.sh --toggle

[module/nixos]
type = custom/text
label = 
label-foreground = #FFFFFF
label-padding = 0
click-left = rofi -show drun

[module/dwm]
type = internal/dwm
format = <label-tags> <label-layout>
socket-path = /tmp/dwm.sock
label-separator = %{O16}

enable-tags-click = true
enable-tags-scroll = true
tags-scroll-empty = true
tags-scroll-reverse = false
tags-scroll-wrap = true

label-focused = %name%
label-focused-foreground = #ffffff
label-focused-underline = #ffffff

label-visible = %name%
label-visible-foreground = #778899

label-occupied = %name%
label-occupied-foreground = #ffffff

label-empty = %name%
label-empty-foreground = #555555

label-unfocused = %name%
label-unfocused-foreground = #555555

label-urgent = %name%
label-urgent-foreground = #A54242

label-layout = %{O8}%symbol%
label-layout-foreground = #ffffff
label-layout-padding = 0



; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 0pt
tray-spacing = 2pt
tray-size = 80%
format-padding = 0

[module/xworkspaces]
type = internal/xworkspaces

[module/xwindow]
type = internal/xwindow
label = %class:0:30:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
